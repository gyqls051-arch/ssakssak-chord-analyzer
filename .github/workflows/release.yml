name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build exe and publish release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches APP_VERSION
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $app = (Select-String -Path version.py -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          if ($tag -ne $app) { throw "version mismatch: tag=$tag version.py=$app" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python test_analyze.py

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "SsakSsakChordAnalyzer" `
            --collect-all librosa --collect-all soundfile --collect-all audioread `
            --hidden-import matplotlib.backends.backend_agg gui.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          gh release create "${{ github.ref_name }}" `
            --repo ${{ github.repository }} `
            --title "싹싹김치 음원 코드 냠냠 v$ver" `
            --generate-notes `
            "dist/SsakSsakChordAnalyzer.exe" `
            "LICENSE"
