name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build exe and publish release
    runs-on: windows-latest
    env:
      SSAK_SIGN_THUMBPRINT: ${{ vars.SSAK_SIGN_THUMBPRINT }}
      SSAK_SIGN_TIMESTAMP: ${{ vars.SSAK_SIGN_TIMESTAMP }}
      SSAK_RELEASE_BUILD: "1"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches APP_VERSION
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $app = (Select-String -Path version.py -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          if ($tag -ne $app) { throw "version mismatch: tag=$tag version.py=$app" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python test_analyze.py

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --version-file version_info.txt --icon "assets/brand/app.ico" --add-data "assets/brand;assets/brand" --name "SsakSsakChordAnalyzer" `
            --collect-all librosa --collect-all soundfile --collect-all audioread `
            --hidden-import matplotlib.backends.backend_agg gui.py

      - name: Sign and verify update executable
        env:
          SSAK_SIGN_PFX: ${{ secrets.SSAK_SIGN_PFX }}
          SSAK_SIGN_PASSWORD: ${{ secrets.SSAK_SIGN_PASSWORD }}
        shell: pwsh
        run: ./tools/sign_release.ps1 -Artifact "dist/SsakSsakChordAnalyzer.exe" -Product "SsakSsak Chord Analyzer" -Version "1.0.1"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          gh release create "${{ github.ref_name }}" `
            --repo ${{ github.repository }} `
            --title "싹싹김치 음원 코드 냠냠 v$ver" `
            --generate-notes `
            "dist/SsakSsakChordAnalyzer.exe" `
            "LICENSE"

      - name: Bump version.json for auto-update
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $j = Get-Content version.json -Raw | ConvertFrom-Json
          $j.latest_version = $ver
          $j | ConvertTo-Json -Depth 5 | Set-Content version.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: bump version.json to $ver [skip ci]"
            git push origin HEAD:main
          } else {
            echo "version.json already at $ver — nothing to commit"
          }
